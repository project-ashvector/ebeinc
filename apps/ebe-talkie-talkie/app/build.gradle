plugins {
    id 'com.android.application'
}

def talkieApiUrl = project.findProperty('TALKIE_API_URL') ?: 'https://ebe-talkie-talkie-social.peat-leather.workers.dev'
def escapedTalkieApiUrl = talkieApiUrl.replace('\\', '\\\\').replace('"', '\\"')

android {
    namespace 'online.ebeinc.talkietalkie'
    compileSdk 35

    defaultConfig {
        applicationId 'online.ebeinc.talkietalkie'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.2.1'
        buildConfigField 'String', 'TALKIE_API_URL', '"' + escapedTalkieApiUrl + '"'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        familyTest {
            storeFile file('signing/ebe-talkie-family.jks')
            storePassword 'EBETalkieFamily2026!'
            keyAlias 'ebe-talkie'
            keyPassword 'EBETalkieFamily2026!'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.familyTest
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.familyTest
        }
    }

}

dependencies {
    implementation 'io.github.webrtc-sdk:android:150.7871.01'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}

