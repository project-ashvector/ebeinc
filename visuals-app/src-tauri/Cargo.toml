[package]
name="allthings140radio-visuals"
version="0.2.2"
description="ALLTHINGS140Radio Visuals show-control workstation"
authors= ["ALLTHINGS140Radio"]
edition="2021"
[lib]
name="allthings140radio_visuals_lib"
crate-type= ["staticlib", "cdylib", "rlib"]
[[bin]]
name="allthings140radio-visuals"
path="src/main.rs"
[build-dependencies]
tauri-build= {version="2",features= [] }
[dependencies]
tauri= {version="2",features= ["protocol-asset"] }
tauri-plugin-dialog="2"
serde= {version="1",features= ["derive"] }
serde_json="1"
dirs="6"
chrono="0.4"
once_cell="1"
url="2"
sha2="0.10"
