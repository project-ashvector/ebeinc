# Isolated static-media origin. Include this from the staging nginx server block.
# Keep realtime WebSocket proxying in its existing server block/service.
location /stage/ {
    alias /srv/allthings140-visuals/media/stage/;
    add_header Access-Control-Allow-Origin "https://allthings140-visuals-green.pages.dev" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range" always;
    add_header Accept-Ranges bytes always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    types { video/mp4 mp4; }
    try_files $uri =404;
}
location /visuals/ {
    alias /srv/allthings140-visuals/media/visuals/;
    add_header Access-Control-Allow-Origin "https://allthings140-visuals-green.pages.dev" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range" always;
    add_header Accept-Ranges bytes always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    types { video/mp4 mp4; }
    try_files $uri =404;
}
