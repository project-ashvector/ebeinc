html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#000;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

/* Shared compositor, visuals-only shell: never show Green Room audience chrome. */

.visuals-identity-logo{height:clamp(40px,5.2vw,68px);width:auto;max-width:clamp(110px,15vw,175px);object-fit:contain;filter:drop-shadow(0 0 14px #9d2bff99);pointer-events:none;user-select:none;-webkit-user-select:none}
.visuals-menu{position:fixed;z-index:50;top:0;left:0;width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(12px + env(safe-area-inset-top)) max(18px,var(--persistent-account-clearance,18px)) 24px 18px;background:linear-gradient(180deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,.4) 60%,rgba(0,0,0,0) 100%);pointer-events:none}

.visuals-menu a,.listen-live{pointer-events:auto;display:inline-flex;align-items:center;gap:.55rem;min-height:42px;padding:.65rem 1.1rem;border:1px solid rgba(201,105,255,.58);border-radius:999px;background:rgba(10,3,17,.65);box-shadow:0 0 24px rgba(157,43,255,.2);color:#fff;font:700 .78rem/1 system-ui,sans-serif;letter-spacing:.14em;text-decoration:none;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:border-color .2s,background .2s,transform .2s;cursor:pointer;white-space:nowrap}
.visuals-menu a:hover,.visuals-menu a:focus-visible,.listen-live:hover,.listen-live:focus-visible{border-color:#e3a8ff;background:rgba(68,17,90,.78);transform:translateY(-1px);outline:none}
.listen-live[data-state="playing"]{border-color:#6fffc3;color:#baffdf}
.listen-live[data-state="connecting"]{border-color:#ffd166;color:#ffe8a3}
.listen-live[data-state="error"]{border-color:#ff8eae;color:#ffd0dc}
.now-playing-card{position:fixed;z-index:40;left:50%;bottom:clamp(18px,4.5vh,52px);transform:translateX(-50%);width:min(520px,calc(100vw - 32px));padding:12px 18px 14px;border:1px solid rgba(206,125,255,.55);border-radius:14px;background:linear-gradient(135deg,rgba(8,3,15,.88),rgba(23,7,34,.78));box-shadow:0 8px 36px rgba(0,0,0,.5),0 0 28px rgba(157,43,255,.18);color:#fff;text-align:center;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);pointer-events:none}
.now-playing-card[data-mode="live"]{border-color:rgba(111,255,195,.65);box-shadow:0 8px 36px rgba(0,0,0,.5),0 0 28px rgba(45,255,185,.2)}
.now-playing-label{display:block;color:#dba5ff;font:800 .66rem/1.2 system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase}
.now-playing-card[data-mode="live"] .now-playing-label{color:#9dffd5}
.now-playing-title{display:block;margin-top:6px;font:800 clamp(.88rem,2vw,1.08rem)/1.2 system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now-playing-artist{display:block;margin-top:3px;color:rgba(255,255,255,.78);font:500 .76rem/1.2 system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.takeover-logo{position:fixed;z-index:30;top:77%;width:8.5vw;height:9vw;max-width:150px;max-height:150px;min-width:72px;min-height:72px;display:grid;place-items:center;background:transparent;filter:drop-shadow(0 0 14px rgba(157,43,255,.6));pointer-events:none}
.takeover-logo[hidden]{display:none}
.takeover-logo.left{left:10.5%}
.takeover-logo.right{right:10.5%}
.takeover-logo img{width:100%;height:100%;object-fit:contain}
.nav-label-mobile{display:none}
.nav-label-desktop{display:inline}
@media(max-width:768px){
  .visuals-identity-hud{top:calc(8px + env(safe-area-inset-top))}
  .visuals-identity-logo{height:clamp(34px,8vw,46px);max-width:110px}
  .visuals-menu{padding:calc(8px + env(safe-area-inset-top)) max(10px,var(--persistent-account-clearance,10px)) 16px 10px;gap:8px}
  .roadmap-link{display:none!important}
  .visuals-menu a,.listen-live{min-height:36px;padding:.5rem .75rem;font-size:.7rem;letter-spacing:.08em}
  .now-playing-card{bottom:56px;width:calc(100vw - 32px);padding:9px 12px 10px}
  .now-playing-label{font-size:.62rem}
  .now-playing-title{font-size:.82rem}
  .now-playing-artist{font-size:.7rem}
  .takeover-logo{top:73%;width:clamp(84px,24vw,112px);height:clamp(84px,24vw,112px);min-width:0;min-height:0}
  .takeover-logo.left{left:50%;transform:translateX(-50%)}
  .takeover-logo.right{display:none}
}
@media(max-width:540px){
  .nav-label-mobile{display:inline}
  .nav-label-desktop{display:none}
  .visuals-identity-logo{height:32px;max-width:74px}
  .visuals-menu{padding-left:6px;padding-right:max(6px,var(--persistent-account-clearance,6px));gap:6px}
  .visuals-menu a,.listen-live{min-height:34px;padding:.42rem .58rem;font-size:.66rem;letter-spacing:.04em}
}
</style>

<body>

<main id="stage" data-renderer-shell="visuals-only">

</aside>

<audio id="audio" preload="none"></audio>

<script src="../vendor-hls-1.7.1.min.js"></script>
<script>
(() => {
  "use strict";
  const button = document.getElementById("listen");
  const audio = window.top !== window && window.top.AT140Radio
    ? window.top.AT140Radio.client(window)
    : document.getElementById("audio");
  const video = document.getElementById("legacyFallbackVideo");
  const nowCard = document.getElementById("nowPlayingCard");
  const nowLabel = document.getElementById("nowPlayingLabel");
  const nowTitle = document.getElementById("nowPlayingTitle");
  const nowArtist = document.getElementById("nowPlayingArtist");
  const statusUrls = ["/api/public/status", "https://status.ebeinc.online/api/public/status"];

  let streamUrl = "";
  let wantsLive = window.top !== window && window.top.AT140Radio
    ? window.top.AT140Radio.desiredPlay
    : false;
  let reconnectTimer = 0;
  let reconnectAttempts = 0;
  let resolving = false;

  function initVideo() {
    if (!video) return;
    video.muted = true;
    video.defaultMuted = true;
    video.playsInline = true;
    const mobileQuery = window.matchMedia("(max-width: 680px)");
    let desktopHls = null;
    let selectedMode = "";
    const fallbackVisible = () => !document.getElementById("legacyFallback")?.hidden;

    const playVideo = () => {
      if (document.hidden || !fallbackVisible()) return;
      const p = video.play();
      if (p !== undefined) {
        p.catch(() => {
          // Retry on user interaction if autoplay blocked
          const unlock = () => {
            video.play().catch(() => {});
            document.removeEventListener("pointerdown", unlock);
            document.removeEventListener("keydown", unlock);
          };
          document.addEventListener("pointerdown", unlock, { once: true });
          document.addEventListener("keydown", unlock, { once: true });
        });
      }
    };

    const useDirectSource = source => {
      video.src = source;
      video.load();
      playVideo();
    };

    const selectVideoSource = () => {
      const isMobile = mobileQuery.matches;
      const mode = isMobile ? "mobile" : "desktop";
      if (selectedMode === mode) return;
      selectedMode = mode;
      if (desktopHls) {
        desktopHls.destroy();
        desktopHls = null;
      }
      video.removeAttribute("src");
      if (isMobile) {
        video.removeAttribute("poster");
        useDirectSource(video.dataset.mobileSrc);
        return;
      }

      video.poster = video.dataset.desktopPoster;
      if (video.canPlayType("application/vnd.apple.mpegurl")) {
        useDirectSource(video.dataset.desktopSrc);
        return;
      }
      if (window.Hls && Hls.isSupported()) {
        desktopHls = new Hls({
          enableWorker: true,
          maxBufferLength: 30,
          maxMaxBufferLength: 60
        });
        desktopHls.loadSource(video.dataset.desktopSrc);
        desktopHls.attachMedia(video);
        desktopHls.on(Hls.Events.MANIFEST_PARSED, playVideo);
        desktopHls.on(Hls.Events.ERROR, (_event, data) => {
          if (!data.fatal || !desktopHls) return;
          if (data.type === Hls.ErrorTypes.NETWORK_ERROR) desktopHls.startLoad();
          else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) desktopHls.recoverMediaError();
          else {
            desktopHls.destroy();
            desktopHls = null;
            useDirectSource(video.dataset.desktopFallback);
          }
        });
        return;
      }
      useDirectSource(video.dataset.desktopFallback);
    };

    selectVideoSource();
    mobileQuery.addEventListener("change", selectVideoSource);
    playVideo();
    video.addEventListener("ended", () => {
      video.currentTime = 0;
      playVideo();
    });
    video.addEventListener("pause", () => {
      if (!document.hidden && fallbackVisible()) playVideo();
    });
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        video.pause();
      } else {
        playVideo();
      }
    });
  }

  function setButton(state, label) {
    button.dataset.state = state;
    button.textContent = label;
    button.disabled = state === "connecting" || state === "reconnecting";
  }

  function clean(value, fallback) {
    const text = String(value || "").trim();
    return text || fallback;
  }

  function showNowPlaying(data) {
    const takeover = data.active_takeover || null;
    const isLive = data.mode === "live" || data.live === true;
    const sourceTitle = clean(data.current_title, "");
    const inferredHost = sourceTitle.match(/(?:Guest|Live).*?([A-Za-z0-9][A-Za-z0-9 _.'-]*)$/i)?.[1];
    const liveHost = clean(takeover?.artist || data.live_host || inferredHost, "GUEST DJ");

    nowCard.dataset.mode = isLive ? "live" : "autodj";
    nowLabel.textContent = isLive ? `NOW LIVE: ${liveHost}` : "24/7 PLAYLIST";
    nowTitle.textContent = clean(data.current_title, "Station uplink");
    nowArtist.textContent = clean(data.current_artist, isLive ? "Live Takeover" : "AllThings140Radio");

    const DEFAULT_STATION_LOGO = "../assets/takeover-fallback-logo.webp";
    const targetLogo = (takeover?.logo_url && typeof takeover.logo_url === "string" && takeover.logo_url.trim())
      ? takeover.logo_url.trim()
      : DEFAULT_STATION_LOGO;
    const targetAlt = (isLive && takeover?.artist) ? `${takeover.artist} logo` : "ALLTHINGS140 Radio logo";

    const topLogo = document.getElementById("visualsTopLogo");
    if (topLogo) {
      if (topLogo.getAttribute("src") !== targetLogo) {
        topLogo.onerror = () => {
          topLogo.onerror = null;
          topLogo.src = DEFAULT_STATION_LOGO;
          topLogo.alt = "ALLTHINGS140 Radio logo";
        };
        topLogo.src = targetLogo;
      }
      topLogo.alt = targetAlt;
    }

    const modeLogo = document.getElementById("modeLogo");
    if (modeLogo) {
      if (modeLogo.getAttribute("src") !== targetLogo) {
        modeLogo.onerror = () => {
          modeLogo.onerror = null;
          modeLogo.src = DEFAULT_STATION_LOGO;
          modeLogo.alt = "ALLTHINGS140 Radio logo";
        };
        modeLogo.src = targetLogo;
      }
      modeLogo.alt = targetAlt;
    }

    const logoBoxes = document.querySelectorAll("[data-takeover-logo]");
    logoBoxes.forEach(box => {
      if (takeover) {
        box.hidden = false;
        const img = box.querySelector("img");
        if (img) {
          img.src = targetLogo;
          img.alt = targetAlt;
        }
      } else {
        box.hidden = true;
      }
    });
  }

  async function resolveStatus() {
    for (const statusUrl of statusUrls) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 5000);
      try {
        const response = await fetch(statusUrl + "?t=" + Date.now(), {
          cache: "no-store",
          signal: controller.signal
        });
        if (!response.ok) throw new Error("status");
        const data = await response.json();
        if (!data.online || !data.stream_url) throw new Error("offline");
        showNowPlaying(data);
        return data;
      } catch {
      } finally {
        clearTimeout(timer);
      }
    }
    throw new Error("offline");
  }

  async function resolveStream() {
    const data = await resolveStatus();
    if (streamUrl !== data.stream_url) {
      streamUrl = data.stream_url;
      audio.src = streamUrl;
      audio.load();
    }
    return streamUrl;
  }

  async function connectLive() {
    if (!wantsLive || resolving) return;
    resolving = true;
    setButton(reconnectAttempts ? "reconnecting" : "connecting", reconnectAttempts ? "RECONNECTING…" : "CONNECTING…");
    try {
      await resolveStream();
      await audio.play();
      clearTimeout(reconnectTimer);
      reconnectTimer = 0;
      reconnectAttempts = 0;
      setButton("playing", "❚❚ PAUSE LIVE");
    } catch (error) {
      if (error?.name === "NotAllowedError") {
        wantsLive = false;
        clearTimeout(reconnectTimer);
        reconnectTimer = 0;
        setButton("idle", "▶ LISTEN LIVE");
      } else if (wantsLive) {
        scheduleReconnect();
      } else {
        setButton("error", "TRY AGAIN");
      }
    } finally {
      resolving = false;
    }
  }

  function scheduleReconnect() {
    if (!wantsLive || reconnectTimer) return;
    setButton("reconnecting", "RECONNECTING…");
    const wait = Math.min(15000, 1000 * Math.pow(2, Math.min(reconnectAttempts++, 4)));
    reconnectTimer = setTimeout(() => {
      reconnectTimer = 0;
      connectLive();
    }, wait);
  }

  async function toggleLive() {
    if (wantsLive && !audio.paused) {
      wantsLive = false;
      clearTimeout(reconnectTimer);
      reconnectTimer = 0;
      audio.pause();
      setButton("idle", "▶ LISTEN LIVE");
      return;
    }
    wantsLive = true;
    await connectLive();
  }

  button.addEventListener("click", toggleLive);
  audio.addEventListener("playing", () => {
    reconnectAttempts = 0;
    if (wantsLive) setButton("playing", "❚❚ PAUSE LIVE");
  });
  audio.addEventListener("error", () => { if (wantsLive) scheduleReconnect(); });
  audio.addEventListener("ended", () => { if (wantsLive) scheduleReconnect(); });
  audio.addEventListener("pause", () => {
    if (wantsLive && !reconnectTimer) scheduleReconnect();
  });
  window.addEventListener("online", () => { if (wantsLive) connectLive(); });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) return;
    if (wantsLive && audio.paused) connectLive();
  });

  setInterval(() => { if (wantsLive && audio.paused) connectLive(); }, 12000);
  setInterval(() => { if (!document.hidden) resolveStatus().catch(() => {}); }, 10000);

  initVideo();
  resolveStatus().catch(() => {});
})();
</script>
