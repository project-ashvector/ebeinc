*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}video{position:fixed;inset:0;display:block;width:100vw;height:100dvh;object-fit:cover;background:#000}.visuals-menu{position:fixed;z-index:2;top:0;left:0;width:100%;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 18px 34px;background:linear-gradient(180deg,rgba(0,0,0,.72),rgba(0,0,0,0));pointer-events:none}.visuals-menu a,.listen-live{pointer-events:auto;display:inline-flex;align-items:center;gap:.55rem;min-height:42px;padding:.65rem 1rem;border:1px solid rgba(201,105,255,.58);border-radius:999px;background:rgba(10,3,17,.58);box-shadow:0 0 24px rgba(157,43,255,.2);color:#fff;font:700 .78rem/1 system-ui,sans-serif;letter-spacing:.14em;text-decoration:none;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:border-color .2s,background .2s,transform .2s}.listen-live{cursor:pointer}.visuals-menu a:hover,.visuals-menu a:focus-visible,.listen-live:hover,.listen-live:focus-visible{border-color:#e3a8ff;background:rgba(68,17,90,.72);transform:translateY(-1px);outline:none}.listen-live[data-state="playing"]{border-color:#6fffc3;color:#baffdf}.listen-live[data-state="error"]{border-color:#ff8eae;color:#ffd0dc}@media(max-width:480px){.visuals-menu{padding-left:12px;padding-right:12px}.visuals-menu a,.listen-live{min-height:40px;padding:.6rem .85rem;font-size:.72rem}}

<body><nav class="visuals-menu" aria-label="Visuals navigation"><a href="../" aria-label="Back to the AllThings140Radio main page"><span aria-hidden="true">&#8592;</span> MAIN PAGE</a><button class="listen-live" id="listenLive" type="button" data-state="idle">▶ LISTEN LIVE</button></nav><video autoplay muted loop playsinline webkit-playsinline preload="auto" disablepictureinpicture controlslist="nodownload noplaybackrate nofullscreen"><source src="../assets/radiovisualtab.mp4?v=2.0.0" type="video/mp4"></video><audio id="liveAudio" preload="none"></audio><script>const button=document.getElementById("listenLive"),audio=document.getElementById("liveAudio"),statusUrl="https://status.ebeinc.online/api/public/status";let streamUrl="";async function resolveStream(){const response=await fetch(statusUrl,{cache:"no-store"});if(!response.ok)throw new Error("status");const data=await response.json();if(!data.stream_url)throw new Error("stream");if(streamUrl!==data.stream_url){streamUrl=data.stream_url;audio.src=streamUrl}return streamUrl}async function toggleLive(){if(!audio.paused){audio.pause();button.dataset.state="idle";button.textContent="▶ LISTEN LIVE";return}button.disabled=true;button.textContent="CONNECTING…";try{await resolveStream();await audio.play();button.dataset.state="playing";button.textContent="❚❚ PAUSE LIVE"}catch{button.dataset.state="error";button.textContent="TRY AGAIN"}finally{button.disabled=false}}button.addEventListener("click",toggleLive);audio.addEventListener("pause",()=>{if(button.dataset.state==="playing"){button.dataset.state="idle";button.textContent="▶ LISTEN LIVE"}});</script></body>
