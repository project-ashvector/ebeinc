<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>AllThings140Radio // Visuals</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}video{position:fixed;inset:0;display:block;width:100vw;height:100dvh;object-fit:cover;background:#000}.visuals-menu{position:fixed;z-index:2;top:0;left:0;width:100%;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 18px 34px;background:linear-gradient(180deg,rgba(0,0,0,.72),rgba(0,0,0,0));pointer-events:none}.visuals-menu a,.listen-live{pointer-events:auto;display:inline-flex;align-items:center;gap:.55rem;min-height:42px;padding:.65rem 1rem;border:1px solid rgba(201,105,255,.58);border-radius:999px;background:rgba(10,3,17,.58);box-shadow:0 0 24px rgba(157,43,255,.2);color:#fff;font:700 .78rem/1 system-ui,sans-serif;letter-spacing:.14em;text-decoration:none;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:border-color .2s,background .2s,transform .2s}.listen-live{cursor:pointer}.visuals-menu a:hover,.visuals-menu a:focus-visible,.listen-live:hover,.listen-live:focus-visible{border-color:#e3a8ff;background:rgba(68,17,90,.72);transform:translateY(-1px);outline:none}.listen-live[data-state="playing"]{border-color:#6fffc3;color:#baffdf}.listen-live[data-state="error"]{border-color:#ff8eae;color:#ffd0dc}.now-playing-card{position:fixed;z-index:2;left:50%;bottom:clamp(18px,4.5vh,52px);transform:translateX(-50%);width:min(520px,calc(100vw - 32px));padding:12px 18px 14px;border:1px solid rgba(206,125,255,.55);border-radius:14px;background:linear-gradient(135deg,rgba(8,3,15,.84),rgba(23,7,34,.72));box-shadow:0 8px 36px rgba(0,0,0,.42),0 0 28px rgba(157,43,255,.16);color:#fff;text-align:center;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);pointer-events:none}.now-playing-card[data-mode="live"]{border-color:rgba(111,255,195,.65);box-shadow:0 8px 36px rgba(0,0,0,.42),0 0 28px rgba(45,255,185,.15)}.now-playing-label{display:block;color:#dba5ff;font:800 .66rem/1.2 system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase}.now-playing-card[data-mode="live"] .now-playing-label{color:#9dffd5}.now-playing-title{display:block;margin-top:6px;font:800 clamp(.88rem,2vw,1.08rem)/1.2 system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.now-playing-artist{display:block;margin-top:3px;color:rgba(255,255,255,.72);font:500 .76rem/1.2 system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}@media(max-width:480px){.visuals-menu{padding-left:12px;padding-right:12px}.visuals-menu a,.listen-live{min-height:40px;padding:.6rem .85rem;font-size:.72rem}.now-playing-card{bottom:14px;width:calc(100vw - 24px);padding:10px 14px 12px}}
</style>
</head>
<body><nav class="visuals-menu" aria-label="Visuals navigation"><a href="../" aria-label="Back to the AllThings140Radio main page"><span aria-hidden="true">&#8592;</span> MAIN PAGE</a><button class="listen-live" id="listenLive" type="button" data-state="idle">▶ LISTEN LIVE</button></nav><video id="visualVideo" autoplay muted loop playsinline webkit-playsinline preload="auto" disablepictureinpicture controlslist="nodownload noplaybackrate nofullscreen"><source src="../assets/radiovisualtab.mp4?v=2.0.0" type="video/mp4"></video><aside class="now-playing-card" id="nowPlayingCard" data-mode="autodj" aria-live="polite"><span class="now-playing-label" id="nowPlayingLabel">24/7 PLAYLIST</span><strong class="now-playing-title" id="nowPlayingTitle">Connecting to station…</strong><span class="now-playing-artist" id="nowPlayingArtist">AllThings140Radio</span></aside><audio id="liveAudio" preload="none"></audio><script>
const button=document.getElementById("listenLive"),audio=document.getElementById("liveAudio"),video=document.getElementById("visualVideo"),statusUrl="https://status.ebeinc.online/api/public/status";
const nowCard=document.getElementById("nowPlayingCard"),nowLabel=document.getElementById("nowPlayingLabel"),nowTitle=document.getElementById("nowPlayingTitle"),nowArtist=document.getElementById("nowPlayingArtist");
let streamUrl="",wantsLive=false,reconnectTimer=0,reconnectAttempts=0,resolving=false;
function setButton(state,label){button.dataset.state=state;button.textContent=label;button.disabled=state==="connecting"||state==="reconnecting"}
function clean(value,fallback){const text=String(value||"").trim();return text||fallback}
function showNowPlaying(data){const isLive=data.mode==="live"||data.live===true;nowCard.dataset.mode=isLive?"live":"autodj";nowLabel.textContent=isLive?"EBMARAH IS LIVE":"24/7 PLAYLIST";nowTitle.textContent=isLive?"Ebmarah is live":clean(data.current_title,"Station uplink");nowArtist.textContent=isLive?"":clean(data.current_artist,"AllThings140Radio")}
async function resolveStatus(){const response=await fetch(statusUrl+"?t="+Date.now(),{cache:"no-store"});if(!response.ok)throw new Error("status");const data=await response.json();if(!data.online||!data.stream_url)throw new Error("offline");showNowPlaying(data);return data}
async function resolveStream(){const data=await resolveStatus();if(streamUrl!==data.stream_url){streamUrl=data.stream_url;audio.src=streamUrl;audio.load()}return streamUrl}
async function connectLive(){if(!wantsLive||resolving)return;resolving=true;setButton(reconnectAttempts?"reconnecting":"connecting",reconnectAttempts?"RECONNECTING…":"CONNECTING…");try{await resolveStream();await audio.play();clearTimeout(reconnectTimer);reconnectTimer=0;reconnectAttempts=0;setButton("playing","❚❚ PAUSE LIVE")}catch{if(wantsLive)scheduleReconnect();else setButton("error","TRY AGAIN")}finally{resolving=false}}
function scheduleReconnect(){if(!wantsLive||reconnectTimer)return;setButton("reconnecting","RECONNECTING…");const wait=Math.min(15000,1000*2**Math.min(reconnectAttempts++,4));reconnectTimer=setTimeout(()=>{reconnectTimer=0;connectLive()},wait)}
async function toggleLive(){if(wantsLive){wantsLive=false;clearTimeout(reconnectTimer);reconnectTimer=0;audio.pause();setButton("idle","▶ LISTEN LIVE");return}wantsLive=true;await connectLive()}
button.addEventListener("click",toggleLive);
audio.addEventListener("playing",()=>{reconnectAttempts=0;if(wantsLive)setButton("playing","❚❚ PAUSE LIVE")});
audio.addEventListener("error",scheduleReconnect);audio.addEventListener("stalled",scheduleReconnect);audio.addEventListener("ended",scheduleReconnect);
audio.addEventListener("pause",()=>{if(wantsLive)scheduleReconnect()});
window.addEventListener("online",()=>{if(wantsLive)connectLive()});
document.addEventListener("visibilitychange",()=>{if(document.hidden)return;if(wantsLive&&audio.paused)connectLive();if(video.paused)video.play().catch(()=>{})});
setInterval(()=>{if(wantsLive&&audio.paused)connectLive();},12000);
setInterval(()=>{resolveStatus().catch(()=>{});},10000);
video.addEventListener("pause",()=>{if(!document.hidden)video.play().catch(()=>{})});
resolveStatus().catch(()=>{});
</script></body>
</html>
