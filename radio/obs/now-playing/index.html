<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AllThings140Radio — OBS Now Playing</title>
<style>
:root{color-scheme:dark;--accent:#b94cff;--cyan:#67efff}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:Inter,Arial,sans-serif}.stage{position:absolute;inset:0;display:flex;align-items:flex-end;padding:26px}.card{position:relative;display:grid;grid-template-columns:72px minmax(0,1fr);align-items:center;width:min(760px,calc(100vw - 52px));min-height:108px;padding:16px 24px 16px 17px;border:1px solid color-mix(in srgb,var(--accent) 68%,transparent);border-radius:17px;background:linear-gradient(135deg,rgba(7,2,14,.94),rgba(28,8,42,.9));box-shadow:0 15px 45px rgba(0,0,0,.55),0 0 32px color-mix(in srgb,var(--accent) 26%,transparent);opacity:1;transform:translateY(0);transition:opacity .35s,transform .35s}.logo{width:56px;height:56px;border-radius:13px;object-fit:cover;box-shadow:0 0 22px color-mix(in srgb,var(--accent) 44%,transparent)}.copy{min-width:0;padding-left:14px}.eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:7px;color:#dea6ff;font-size:12px;font-weight:900;letter-spacing:.18em}.dot{width:8px;height:8px;border-radius:50%;background:#66ffc7;box-shadow:0 0 12px #66ffc7}.title,.artist{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.title{color:#fff;font-size:clamp(22px,3.2vw,36px);line-height:1.08;font-weight:900}.artist{margin-top:5px;color:#c9bcd1;font-size:clamp(14px,1.8vw,20px);font-weight:600}.offline .dot{background:#ff557e;box-shadow:0 0 12px #ff557e}.offline .eyebrow{color:#ff9db4}.compact .stage{padding:12px}.compact .card{grid-template-columns:48px minmax(0,1fr);min-height:72px;padding:10px 16px 10px 11px;border-radius:12px}.compact .logo{width:40px;height:40px;border-radius:9px}.compact .eyebrow{font-size:9px;margin-bottom:4px}.compact .title{font-size:21px}.compact .artist{font-size:13px}.hide-logo .card{grid-template-columns:1fr}.hide-logo .logo{display:none}.hide-logo .copy{padding-left:0}
</style>
</head>
<body>
<main class="stage"><section class="card" id="card"><img class="logo" src="../../assets/allthings140-logo-192.webp" alt=""><div class="copy"><span class="eyebrow"><i class="dot"></i><span id="label">NOW PLAYING</span></span><strong class="title" id="title">Connecting to AllThings140Radio…</strong><span class="artist" id="artist">24/7 heavy dubstep</span></div></section></main>
<script>
const endpoints=["/api/public/status","https://status.ebeinc.online/api/public/status"],card=document.getElementById("card"),label=document.getElementById("label"),title=document.getElementById("title"),artist=document.getElementById("artist"),params=new URLSearchParams(location.search);let lastSuccess=0,pending=false;
if(params.get("compact")==="1")document.body.classList.add("compact");if(params.get("logo")==="0")document.body.classList.add("hide-logo");if(/^#[0-9a-f]{6}$/i.test(params.get("accent")||""))document.documentElement.style.setProperty("--accent",params.get("accent"));
function clean(value,fallback=""){return String(value||"").trim()||fallback}function render(data){const live=data.mode==="live"||data.live===true,source=clean(data.current_title),host=clean(data.live_host||source.match(/(?:Guest|Live).*?([A-Za-z0-9][A-Za-z0-9 _.'-]*)$/i)?.[1],"Guest DJ");card.classList.remove("offline");label.textContent=live?`LIVE TAKEOVER · ${host}`:"NOW PLAYING";title.textContent=live?host:clean(data.current_title,"AllThings140Radio");artist.textContent=live?"LIVE ON ALLTHINGS140RADIO":clean(data.current_artist,"24/7 heavy dubstep");lastSuccess=Date.now()}
async function update(){if(pending)return;pending=true;let ok=false;for(const endpoint of endpoints){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),4500);try{const response=await fetch(`${endpoint}?obs=${Date.now()}`,{cache:"no-store",signal:controller.signal});if(!response.ok)throw Error("status");const data=await response.json();if(!data.online)throw Error("offline");render(data);ok=true;break}catch{}finally{clearTimeout(timer)}}if(!ok&&Date.now()-lastSuccess>15000){card.classList.add("offline");label.textContent="RECONNECTING";title.textContent="AllThings140Radio";artist.textContent="Waiting for station status…"}pending=false}
update();setInterval(update,3000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)update()});
</script>
</body>
</html>
