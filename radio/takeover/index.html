<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09040f"><meta name="robots" content="noindex,nofollow"><title>Schedule Your AllThings140 Takeover</title><link rel="icon" href="../assets/allthings140-logo-64.png"><style>
html{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#28103d,#08040d 52%);color:#f7efff;font-family:system-ui,sans-serif;min-height:100vh;padding:24px}.shell{width:min(800px,100%);margin:auto;border:1px solid #873fb4;background:#0c0713eb;padding:clamp(20px,5vw,42px)}.brand{width:76px;border-radius:16px}h1{font-size:clamp(2rem,7vw,4.5rem);line-height:.9;margin:24px 0}p{color:#b8aabd;line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:6px;color:#dc92ff;font-size:.75rem;font-weight:800;letter-spacing:.07em}.wide{grid-column:1/-1}input,textarea,select,button{font:inherit;border:1px solid #6c358b;background:#08040d;color:#fff;padding:12px;min-width:0}textarea{min-height:90px;resize:vertical}button{background:linear-gradient(120deg,#9c2bdd,#236ef2);font-weight:900;cursor:pointer;min-height:48px}.status{min-height:24px;color:#72efbe}.logo-preview{display:flex;align-items:center;gap:14px}.logo-preview img{width:84px;height:84px;object-fit:contain;background:#ffffff08;border:1px solid #6c358b;padding:4px}.hint{font-size:.68rem;color:#8f8298}@media(max-width:620px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><main class="shell"><img class="brand" src="../assets/allthings140-logo-192.webp" alt="AllThings140 Radio"><h1>BUILD YOUR<br>TAKEOVER.</h1><p id="intro">Loading your private artist form…</p><form id="form" hidden><div class="grid">
<label>ARTIST / DJ NAME<input id="artist" maxlength="100" required></label><label>SHOW TITLE<input id="title" maxlength="140" placeholder="Optional"></label>
<label>DATE<input id="date" type="date" required></label><label>TIMEZONE<select id="timezone" required></select></label>
<label>START TIME<select id="start" required></select></label><label>END TIME<select id="end" required></select></label>
<label class="wide">SHOW DETAILS<textarea id="details" maxlength="500" placeholder="Tell listeners what to expect"></textarea></label>
<label>INSTAGRAM URL<input id="instagram" type="url" placeholder="https://instagram.com/…"></label><label>TWITCH URL<input id="twitch" type="url" placeholder="https://twitch.tv/…"></label><label>SOUNDCLOUD URL<input id="soundcloud" type="url" placeholder="https://soundcloud.com/…"></label><label>YOUTUBE URL<input id="youtube" type="url" placeholder="https://youtube.com/…"></label><label>X / TWITTER URL<input id="x" type="url" placeholder="https://x.com/…"></label><label>OTHER SOCIAL URL<input id="other" type="url" placeholder="https://…"></label>
<label class="wide">ARTIST LOGO (OPTIONAL)<span class="logo-preview"><input id="logo" type="file" accept="image/png,image/jpeg,image/webp"><img id="logoPreview" src="../assets/takeover-fallback-logo.webp" alt="Logo preview"></span><span class="hint">PNG, JPEG, or WebP; maximum 2 MB. If omitted, the station logo is used.</span></label>
<button class="wide" type="submit">SUBMIT TAKEOVER</button></div><p class="status" id="status" role="status"></p></form></main><script>
(()=>{const token=location.hash.slice(1),intro=document.querySelector('#intro'),form=document.querySelector('#form'),status=document.querySelector('#status'),$=s=>document.querySelector(s);const zones=['America/Los_Angeles','America/Denver','America/Chicago','America/New_York','America/Phoenix','America/Anchorage','Pacific/Honolulu','Europe/London','Europe/Paris','Australia/Sydney','Asia/Tokyo','UTC'];let local='America/Los_Angeles';try{local=Intl.DateTimeFormat().resolvedOptions().timeZone||local}catch{};[local,...zones].filter((z,i,a)=>a.indexOf(z)===i).forEach(z=>$('#timezone').add(new Option(z.replaceAll('_',' '),z)));for(let h=0;h<24;h++)for(const m of [0,30]){const label=`${h%12||12}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`,value=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;$('#start').add(new Option(label,value));$('#end').add(new Option(label,value))}$('#start').value='14:00';$('#end').value='15:00';const tomorrow=new Date(Date.now()+86400000);$('#date').value=[tomorrow.getFullYear(),String(tomorrow.getMonth()+1).padStart(2,'0'),String(tomorrow.getDate()).padStart(2,'0')].join('-');function zonedEpoch(date,time,zone){const naive=new Date(`${date}T${time}:00Z`);const parts=new Intl.DateTimeFormat('en-US',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(naive);const p=Object.fromEntries(parts.map(x=>[x.type,x.value]));const represented=Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute);return Math.floor((naive.getTime()+(naive.getTime()-represented))/1000)}function readLogo(){const file=$('#logo').files[0];if(!file)return Promise.resolve('');if(file.size>2*1024*1024)return Promise.reject(Error('Logo must be smaller than 2 MB.'));return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('Could not read logo.'));reader.readAsDataURL(file)})}$('#logo').addEventListener('change',()=>{const file=$('#logo').files[0];if(file)$('#logoPreview').src=URL.createObjectURL(file)});if(!token){intro.textContent='This private artist form link is missing or invalid.';return}fetch('/api/public/takeover-invite/'+encodeURIComponent(token),{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(data=>{intro.textContent=`${data.label||'Guest artist'}, fill this out once. Your information will automatically appear in the public takeover schedule.`;form.hidden=false}).catch(()=>intro.textContent='This artist form link is invalid, expired, or already used. Ask the station host for a new link.');form.addEventListener('submit',async e=>{e.preventDefault();const button=form.querySelector('button');button.disabled=true;status.textContent='Publishing your takeover…';try{const timezone=$('#timezone').value,date=$('#date').value;let starts_at=zonedEpoch(date,$('#start').value,timezone),ends_at=zonedEpoch(date,$('#end').value,timezone);if(ends_at<=starts_at)ends_at+=86400;const logo_data=await readLogo();const socials=['instagram','twitch','soundcloud','youtube','x','other'].map(id=>({platform:id==='x'?'X':id,url:$('#'+id).value.trim()})).filter(x=>x.url);const response=await fetch('/api/public/takeover-invite/'+encodeURIComponent(token),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({artist:$('#artist').value.trim(),title:$('#title').value.trim(),starts_at,ends_at,timezone,logo_data,details:$('#details').value.trim(),socials})});const data=await response.json();if(!response.ok)throw Error(data.error||'Could not submit');form.querySelectorAll('input,textarea,select,button').forEach(el=>el.disabled=true);status.textContent=data.message||'Your takeover is scheduled.'}catch(error){status.textContent=error.message;button.disabled=false}})})();
</script></body></html>
