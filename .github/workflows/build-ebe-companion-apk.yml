name: Build EBE Companion Remote APK

on:
  push:
    branches: [ebe-companion-android-build]
    paths:
      - 'build-input/ebe-companion-android-v0.4.1.zip.b64'
      - '.github/workflows/build-ebe-companion-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ebe-companion-android-build
      - name: Restore and patch Android source
        run: |
          rm -rf ebe-companion-android
          mkdir -p ebe-companion-android
          base64 -d build-input/ebe-companion-android-v0.4.1.zip.b64 > /tmp/ebe-android.zip
          unzip -q /tmp/ebe-android.zip -d ebe-companion-android
          sed -i "s/minSdk 26/minSdk 23/" ebe-companion-android/app/build.gradle
          sed -i "s/versionCode 401/versionCode 402/" ebe-companion-android/app/build.gradle
          sed -i "s/versionName '0.4.1'/versionName '0.4.2'/" ebe-companion-android/app/build.gradle
          sed -i 's/EBECompanionRemote\/0.4.1/EBECompanionRemote\/0.4.2/' ebe-companion-android/app/src/main/java/com/ebedesigns/ebecompanionremote/MainActivity.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build unsigned release APK
        working-directory: ebe-companion-android
        run: gradle --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: ebe-companion-remote-v0.4.2-unsigned
          path: ebe-companion-android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
