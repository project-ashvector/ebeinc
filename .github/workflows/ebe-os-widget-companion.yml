name: Build EBE OS Widget Companion
on:
  push:
    branches: [ ebe-os-v099-widget-companion ]
    paths:
      - 'ebe-os-widget-companion/**'
      - '.github/workflows/ebe-os-widget-companion.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        working-directory: ebe-os-widget-companion
        run: gradle :app:assembleRelease --stacktrace --no-daemon
      - name: Align and validate APK
        run: |
          mkdir -p dist
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 ebe-os-widget-companion/app/build/outputs/apk/release/app-release-unsigned.apk dist/EBE-OS-Widget-Companion-v0.9.9-unsigned-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/EBE-OS-Widget-Companion-v0.9.9-unsigned-aligned.apk | head -10
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 dist/EBE-OS-Widget-Companion-v0.9.9-unsigned-aligned.apk
          sha256sum dist/EBE-OS-Widget-Companion-v0.9.9-unsigned-aligned.apk > dist/EBE-OS-Widget-Companion-v0.9.9-unsigned-aligned.apk.sha256
      - name: Commit build output
        run: |
          git config user.name 'EBE OS Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add dist/EBE-OS-Widget-Companion-v0.9.9-unsigned-aligned.apk dist/EBE-OS-Widget-Companion-v0.9.9-unsigned-aligned.apk.sha256
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build EBE OS v0.9.9 widget companion APK [skip ci]'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: EBE-OS-Widget-Companion-v0.9.9
          path: dist/*
