name: Build EBE Talkie Talkie

on:
  push:
    branches:
      - feature/ebe-talkie-talkie-v0.1.3-rooms-call-alerts
    paths:
      - 'apps/ebe-talkie-talkie/**'
      - '.github/workflows/ebe-talkie-talkie-build.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate v0.1.4 room presence script
        run: node --check apps/ebe-talkie-talkie/app/src/main/assets/enhancements-v014.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build signed family release APK
        working-directory: apps/ebe-talkie-talkie
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify APK signature and package
        run: |
          APK="apps/ebe-talkie-talkie/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -20

      - name: Stage APK
        run: cp apps/ebe-talkie-talkie/app/build/outputs/apk/release/app-release.apk EBE-Talkie-Talkie-v0.1.4-ROOM-COUNTS.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EBE-Talkie-Talkie-v0.1.4-ROOM-COUNTS
          path: EBE-Talkie-Talkie-v0.1.4-ROOM-COUNTS.apk
          if-no-files-found: error
          retention-days: 14
