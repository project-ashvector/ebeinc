name: Build EBE OS v0.5.0 Store Dex

on:
  push:
    branches: [ebe-os-build-v050]
    paths:
      - 'ebe-os-build-v050/**'
      - '.github/workflows/ebe-os-store-v050.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Decode source
        run: |
          mkdir -p build-src
          base64 -d ebe-os-build-v050/store-source.b64 > build-src/store-source.zip
          unzip -o build-src/store-source.zip -d build-src/src

      - name: Compile StoreActivity
        run: |
          mkdir -p build-src/classes build-src/dex
          javac -source 8 -target 8 \
            -cp "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d build-src/classes \
            build-src/src/StoreActivity.java
          "$ANDROID_HOME/build-tools/35.0.0/d8" \
            --lib "$ANDROID_HOME/platforms/android-35/android.jar" \
            --min-api 26 \
            --output build-src/dex \
            $(find build-src/classes -name '*.class')
          mv build-src/dex/classes.dex build-src/EBE-OS-v0.5.0-Store.dex

      - name: Upload Store DEX
        uses: actions/upload-artifact@v4
        with:
          name: ebe-os-v050-store-dex
          path: build-src/EBE-OS-v0.5.0-Store.dex
          if-no-files-found: error
