name: Build EBE Forge APK v0.2.5
on:
  push:
    branches:
      - ebe-forge-apk-build-v0.2.5-r2
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Expand EBE Forge Android v0.2.5 source
        run: |
          base64 --decode ebe-forge-android-v0.2.5-source.zip.b64 > ebe-forge-android-v0.2.5-source.zip
          rm -rf ebe-forge-build
          mkdir -p ebe-forge-build
          unzip -q ebe-forge-android-v0.2.5-source.zip -d ebe-forge-build
          grep -q '^android.useAndroidX=true$' ebe-forge-build/gradle.properties || echo 'android.useAndroidX=true' >> ebe-forge-build/gradle.properties
      - name: Build signed release APK
        working-directory: ebe-forge-build
        run: gradle --no-daemon clean assembleRelease
      - name: Verify and name APK
        run: |
          cp ebe-forge-build/app/build/outputs/apk/release/app-release.apk EBE-Forge-v0.2.5.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs EBE-Forge-v0.2.5.apk | tee APK-SIGNATURE.txt
          sha256sum EBE-Forge-v0.2.5.apk > EBE-Forge-v0.2.5.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: EBE-Forge-v0.2.5-android
          path: |
            EBE-Forge-v0.2.5.apk
            EBE-Forge-v0.2.5.apk.sha256
            APK-SIGNATURE.txt
          if-no-files-found: error
