plugins { id 'com.android.application' }

android {
    namespace 'online.ebeinc.allthings140radio'
    compileSdk 36
    testBuildType 'deviceQa'

    defaultConfig {
        applicationId 'online.ebeinc.allthings140radio'
        minSdk 23
        targetSdk 36
        versionCode 27
        versionName '1.3.11'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        deviceQa.res.srcDirs += ['src/debug/res']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            def releaseStore = project.findProperty('RELEASE_STORE_FILE') ?: System.getenv('KEYSTORE_FILE')
            if (releaseStore) {
                storeFile file(releaseStore)
                storePassword project.findProperty('RELEASE_STORE_PASSWORD') ?: System.getenv('KEYSTORE_PASSWORD') ?: ''
                keyAlias project.findProperty('RELEASE_KEY_ALIAS') ?: System.getenv('KEY_ALIAS') ?: ''
                keyPassword project.findProperty('RELEASE_KEY_PASSWORD') ?: System.getenv('KEY_PASSWORD') ?: ''
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        // Local update build: keeps the production package ID but uses this
        // laptop's existing Android debug keystore. This can update a prior
        // locally-installed build ONLY when that build was signed by the same
        // debug keystore. Never upload this variant to Google Play.
        update {
            debuggable true
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        // Physical-device acceptance build. It keeps the production package
        // and existing upload signature so an installed session is preserved,
        // but exposes QA-only alert controls through BuildConfig.DEBUG. Never
        // distribute this variant; the final release replaces it after QA.
        deviceQa {
            debuggable true
            minifyEnabled false
            versionNameSuffix '-deviceqa'
            if (signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        release {
            // Bootstrap upload while Play unlocks subscription products.
            // Restore both flags for the customer-facing billing release.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        warningsAsErrors false
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

tasks.register('verifyAndroidAutoSourceContract') {
    group = 'verification'
    description = 'Fails when Android Auto media discovery requirements disappear from source.'
    doLast {
        def manifest = file('src/main/AndroidManifest.xml').text
        def descriptor = file('src/main/res/xml/automotive_app_desc.xml').text
        def service = file('src/main/java/online/ebeinc/allthings140radio/RadioService.java').text
        def requiredManifestFragments = [
                'com.google.android.gms.car.application',
                '@xml/automotive_app_desc',
                'android:name=".RadioService"',
                'android:exported="true"',
                'android:foregroundServiceType="mediaPlayback"',
                'androidx.media3.session.MediaLibraryService',
                'android.media.browse.MediaBrowserService'
        ]
        requiredManifestFragments.each { fragment ->
            if (!manifest.contains(fragment)) {
                throw new GradleException("Android Auto contract missing from manifest: ${fragment}")
            }
        }
        if (!descriptor.contains('<uses name="media"')) {
            throw new GradleException('Android Auto descriptor must declare the media capability')
        }
        [
                'extends MediaLibraryService',
                'new MediaLibrarySession.Builder',
                'onGetLibraryRoot(',
                'onGetChildren(',
                '.setIsBrowsable(true)',
                '.setIsPlayable(true)',
                'MEDIA_TYPE_RADIO_STATION'
        ].each { fragment ->
            if (!service.contains(fragment)) {
                throw new GradleException("Android Auto library contract missing from RadioService: ${fragment}")
            }
        }
        if (android.defaultConfig.applicationId != 'online.ebeinc.allthings140radio') {
            throw new GradleException('Unexpected applicationId; Android Auto release must retain the Play package')
        }
    }
}

tasks.named('check').configure { dependsOn tasks.named('verifyAndroidAutoSourceContract') }

dependencies {
    def media3Version = '1.11.0'
    implementation "androidx.media3:media3-exoplayer:${media3Version}"
    implementation "androidx.media3:media3-session:${media3Version}"
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.android.billingclient:billing:9.1.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
