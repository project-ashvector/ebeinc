plugins { id 'com.android.application' }

android {
    namespace 'online.ebeinc.allthings140radio'
    compileSdk 36

    defaultConfig {
        applicationId 'online.ebeinc.allthings140radio'
        minSdk 23
        targetSdk 36
        versionCode 19
        versionName '1.3.3'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            def releaseStore = project.findProperty('RELEASE_STORE_FILE') ?: System.getenv('KEYSTORE_FILE')
            if (releaseStore) {
                storeFile file(releaseStore)
                storePassword project.findProperty('RELEASE_STORE_PASSWORD') ?: System.getenv('KEYSTORE_PASSWORD') ?: ''
                keyAlias project.findProperty('RELEASE_KEY_ALIAS') ?: System.getenv('KEY_ALIAS') ?: ''
                keyPassword project.findProperty('RELEASE_KEY_PASSWORD') ?: System.getenv('KEY_PASSWORD') ?: ''
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        // Local update build: keeps the production package ID but uses this
        // laptop's existing Android debug keystore. This can update a prior
        // locally-installed build ONLY when that build was signed by the same
        // debug keystore. Never upload this variant to Google Play.
        update {
            debuggable true
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        warningsAsErrors false
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    def media3Version = '1.11.0'
    implementation "androidx.media3:media3-exoplayer:${media3Version}"
    implementation "androidx.media3:media3-session:${media3Version}"
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    testImplementation 'junit:junit:4.13.2'
}
